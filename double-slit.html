<style>
/* Layout: three-column lab. Left: apparatus controls. Centre: transport bar, 3D view, then 2D cross-section + screen statistics.
   Right: history and debates, plus equations and method. Single dark look, matching the Light upon Light bench. */
:root{
  --bg:#0a0f16; --bg2:#0d141e; --panel:#101823; --raise:#16212e; --line:#223040; --fg:#dfe7f0; --muted:#8d9db1; --faint:#5d6d80; --hi:#f4efe3;
  --psi:#7fd1ff; --dens:#ffc65c; --hit:#ffffff; --plus:#6ee7a8; --minus:#ff8aa0; --wall:#5b6b80; --warn:#ffb86b;
  --t-exp:#7fd1ff; --t-arg:#ffc65c; --t-crit:#ff8aa0; --t-int:#c6a6ff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--sans);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
a{color:var(--psi)}
.app{display:grid;grid-template-columns:320px minmax(0,1fr) 390px;grid-template-rows:auto minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:var(--bg2);padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;border-radius:50%;display:block;flex:none}
.brand h1{font:600 17px/1.1 var(--cond);margin:0;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:11.5px;letter-spacing:.04em}
.brand p a{color:inherit;text-decoration:none}.brand p a:hover{color:var(--fg)}
.top .eqline{margin-left:auto;font:17px var(--math);color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.left,.right{min-height:0;overflow-y:auto;background:var(--panel);scrollbar-width:thin}
.left{border-right:1px solid var(--line);padding:6px 14px 30px max(14px,env(safe-area-inset-left,0px))}
.right{border-left:1px solid var(--line);padding:0 16px 30px 16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.mid{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}

details.grp{border-bottom:1px solid var(--line);padding:6px 0 10px}
details.grp>summary{cursor:pointer;list-style:none;font:600 12px/1 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:10px 0 8px;display:flex;justify-content:space-between}
details.grp>summary::after{content:"+";font-family:var(--mono)}
details.grp[open]>summary::after{content:"–"}
details.grp>summary::-webkit-details-marker{display:none}
.row{display:grid;grid-template-columns:1fr 96px;gap:2px 8px;align-items:center;margin:7px 0}
.row label{font-size:12.5px;color:var(--fg);min-width:0}
.row label small{color:var(--faint);font-size:11px}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--hi);height:16px;margin:0}
.row input[type=number]{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:2px 5px;font:12px var(--mono);text-align:right}
.row.tri{grid-template-columns:1fr 98px}
.row select{grid-column:1/-1;width:100%;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;font-size:12.5px;cursor:pointer}
.tog input{accent-color:var(--hi);width:16px;height:16px}
.seg{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}
.seg button{flex:1;border:1px solid var(--line);background:none;border-radius:6px;padding:4px 6px;font:500 11.5px var(--cond);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);border-color:var(--hi)}
.hint{font-size:11.5px;color:var(--muted);margin:4px 0 2px;line-height:1.45}
.hint b{color:var(--fg);font-weight:500}
.presets{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:3px 9px;font:500 11.5px var(--cond);cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg2)}
.tb{height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font:500 12px var(--cond);letter-spacing:.02em;white-space:nowrap}
.tb:hover{border-color:var(--muted)}
.tb.primary{background:var(--hi);color:var(--bg);border-color:var(--hi);min-width:40px}
.tb.emit{border-color:var(--dens);color:var(--dens)}
.tb[aria-pressed="true"]{border-color:var(--hi);color:var(--hi)}
.tb[aria-pressed="false"]{color:var(--muted)}
.bar .grow{flex:1;min-width:150px;display:flex;align-items:center;gap:8px}
.bar input[type=range]{accent-color:var(--hi);width:100%}
.bar output{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mini{display:flex;align-items:center;gap:6px;font:500 11.5px var(--cond);color:var(--muted)}
.mini input{width:70px}

.stage{position:relative;flex:1 1 auto;min-height:240px;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;pointer-events:none;font-size:11.5px}
.ov.tl{top:10px;left:12px;background:rgba(10,15,22,.78);border:1px solid var(--line);border-radius:8px;padding:6px 9px;max-width:60%}
.ov.tl b{font:600 11px var(--cond);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ov.tr{top:10px;right:12px;display:flex;gap:4px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
.ov.tr .seg{margin:0}
.ov.tr .seg button{background:rgba(16,24,35,.9)}
.ov.bl{bottom:10px;left:12px;color:var(--faint)}
.ov.msg{left:50%;bottom:14px;transform:translateX(-50%);background:rgba(244,239,227,.95);color:var(--bg);padding:6px 12px;border-radius:8px;font-weight:500;opacity:0;transition:opacity .3s;max-width:90%;text-align:center}
.ov.msg.show{opacity:1}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0;border-top:1px solid var(--line);height:clamp(230px,36vh,340px);flex:none}
.pane{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.pane:last-child{border-right:0}
.pane h4{margin:0;padding:6px 10px;font:600 11px/1.2 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.pane h4 .seg{margin:0 0 0 auto}
.pane h4 .seg button{padding:2px 6px;font-size:11px;letter-spacing:0;text-transform:none}
.cv{position:relative;flex:1;min-height:0}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#v2d{image-rendering:auto}
.legend2{position:absolute;left:8px;bottom:6px;font:11px var(--mono);color:var(--muted);background:rgba(10,15,22,.7);padding:2px 6px;border-radius:5px;pointer-events:none}

.tabs{position:sticky;top:0;z-index:2;display:flex;gap:3px;background:var(--panel);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.tab{flex:1;border:1px solid var(--line);background:none;border-radius:6px;padding:6px 0;cursor:pointer;font:500 12.5px var(--cond);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--raise);color:var(--fg);border-color:var(--muted)}
.view[hidden]{display:none!important}
.right h2{font:600 19px/1.2 var(--cond);margin:14px 0 4px}
.right .lede{color:var(--muted);margin:0 0 8px;font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 6px}
.filters button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 9px;font:500 11.5px var(--cond);color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px}
.filters button i{width:8px;height:8px;border-radius:50%;display:inline-block}
.filters button[aria-pressed="true"]{color:var(--fg);border-color:var(--muted);background:var(--raise)}
.tl-list{position:relative;margin-top:6px}
.card{position:relative;border-left:2px solid var(--line);padding:2px 0 14px 14px;margin-left:4px}
.card::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c,#888);box-shadow:0 0 0 3px var(--panel)}
.card .yr{font:500 11.5px var(--mono);color:var(--faint)}
.card .tag{font:600 10px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-left:6px}
.card h3{margin:2px 0 4px;font:600 14.5px/1.3 var(--cond);color:var(--fg)}
.card h3 span{color:var(--muted);font-weight:500}
.card p{margin:0 0 6px;color:#c3cfdc;font-size:12.8px}
.card blockquote{margin:6px 0;padding:4px 0 4px 10px;border-left:2px solid var(--c);font:italic 14px/1.45 var(--math);color:var(--hi)}
.card blockquote cite{display:block;font:normal 11px var(--sans);color:var(--faint);margin-top:2px}
.card .push{background:rgba(255,138,160,.07);border:1px solid rgba(255,138,160,.22);border-radius:7px;padding:6px 8px;font-size:12.3px;color:#e6c9cf;margin:6px 0}
.card .push b{color:var(--t-crit);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.card .try{margin-top:2px;border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:3px 9px;font:500 11.5px var(--cond);cursor:pointer;color:var(--fg)}
.card .try:hover{border-color:var(--hi)}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:10px 0}
.box h5{margin:0 0 5px;font:600 12.5px var(--cond);letter-spacing:.03em}
.box p,.box li{color:#c3cfdc;font-size:12.6px;margin:0 0 5px}
.box ul{margin:0;padding-left:16px}
.eq{font:16.5px/1.5 var(--math);color:var(--hi);overflow-x:auto;white-space:nowrap;padding:2px 0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 2px}
table.ro{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
table.ro td{padding:3px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.ro td:first-child{color:var(--muted);padding-right:8px}
table.ro td:last-child{text-align:right;font:500 11.8px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.ro tr.h td{color:var(--fg);font:600 11px var(--cond);letter-spacing:.08em;text-transform:uppercase;padding-top:10px}
.warn{color:var(--warn)}

@media (max-width:1280px){
  body{overflow:auto}
  .app{grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto 100svh auto;height:auto}
  .right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);overflow:visible}
  .left{max-height:100svh}
}
@media (max-width:860px){
  .app{display:flex;flex-direction:column}
  .top{order:0}.mid{order:1}.left{order:2}.right{order:3}
  .top{flex-wrap:wrap}.top .eqline{margin-left:0;width:100%;font-size:15px}
  .left{max-height:none;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mid{height:auto;overflow:visible}
  .stage{height:56svh;flex:none}
  .lower{grid-template-columns:1fr;height:auto}
  .pane{height:280px;border-right:0;border-bottom:1px solid var(--line)}
  .right{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .ov.tl{max-width:calc(100% - 24px);top:auto;bottom:10px}
  .ov.tr{max-width:calc(100% - 24px)}
  .ov.bl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
/*ENGINE-START*/
/* =====================================================================
   PHYSICS ENGINE
   Grid: N × N cells, cell size = 1 (simulation unit). x = propagation, y = transverse.
   Massive particles: time-dependent Schrödinger equation, split-step Fourier, ħ = m = 1.
   Photons: Maxwell's equations (2D TE_z: Ez, Hx, Hy) by FDTD (Yee), c = 1.
   Both carry two internal components (index 0, 1) for the which-path marker.
   ===================================================================== */
function makeFFT(n){
  const lev = Math.round(Math.log2(n)), rev = new Uint32Array(n), cs = new Float64Array(n/2), sn = new Float64Array(n/2);
  for (let i=0;i<n;i++){ let r=0; for (let b=0;b<lev;b++) r |= ((i>>b)&1)<<(lev-1-b); rev[i]=r; }
  for (let i=0;i<n/2;i++){ cs[i]=Math.cos(2*Math.PI*i/n); sn[i]=Math.sin(2*Math.PI*i/n); }
  return function(re, im, inv){
    for (let i=0;i<n;i++){ const j=rev[i]; if (j>i){ let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; } }
    const sg = inv ? -1 : 1;
    for (let size=2; size<=n; size<<=1){
      const half=size>>1, step=n/size;
      for (let i=0;i<n;i+=size){
        for (let j=i, k=0; j<i+half; j++, k+=step){
          const l=j+half, c=cs[k], s=sg*sn[k];
          const tr = re[l]*c + im[l]*s, ti = im[l]*c - re[l]*s;
          re[l]=re[j]-tr; im[l]=im[j]-ti; re[j]+=tr; im[j]+=ti;
        }
      }
    }
  };
}

/* cell types */
const FREE=0, WALL=1, CH_U=2, CH_L=3;

class Geometry {
  /* all lengths in cells */
  constructor(N){ this.N=N; this.cell=new Uint8Array(N*N); }
  build(g){
    const N=this.N, c=this.cell, yc=N/2; c.fill(FREE);
    const x0=Math.round(g.xb), x1=Math.max(x0+1, Math.round(g.xb+g.T));
    for (let j=0;j<N;j++){
      const y=j+0.5-yc, inBar = Math.abs(y) <= g.BL/2;
      for (let i=x0;i<x1 && i<N;i++){
        if (i<0) continue;
        let t=WALL;
        if (g.openU && Math.abs(y-g.yU) < g.wU/2)t=CH_U;
        else if (g.openL && Math.abs(y-g.yL) < g.wL/2) t=CH_L;
        else if (!inBar) t=FREE;
        c[j*N+i]=t;
      }
    }
    this.g=g;
  }
}

function absorber(N, w, strength){
  /* per-step damping factor near the edges (complex absorbing layer / sponge) */
  const a=new Float64Array(N*N);
  for (let j=0;j<N;j++) for (let i=0;i<N;i++){
    const d=Math.min(i, j, N-1-i, N-1-j);
    a[j*N+i] = d>=w ? 1 : Math.exp(-strength*Math.pow((w-d)/w, 2));
  }
  return a;
}

/* --- Schrödinger: iħ∂ψ/∂t = −ħ²/2m ∇²ψ (+ walls, absorber, slit channel elements) --- */
class TDSE {
  constructor(N){
    this.kind='tdse'; this.N=N; const S=N*N;
    this.r=[new Float64Array(S),new Float64Array(S)]; this.i=[new Float64Array(S),new Float64Array(S)];
    this.has1=false; this.fft=makeFFT(N); this.cr=new Float64Array(N); this.ci=new Float64Array(N);

  init(p, cell){

    const N=this.N, r=this.r[0], im=this.i[0]; let n=0;

  fluxCell(s, nx, ny, out){

/* --- Maxwell (FDTD, TE_z): ∂H/∂t = −∇×E, ∂E/∂t = ∇×H, c = 1, PEC barrier --- */
class FDTD {
  constructor(N){
    this.kind='fdtd'; this.N=N; const S=N*N, mk=()=>new Float64Array(S);
    this.F=[0,1].map(()=>({Er:mk(),Ei:mk(),Xr:mk(),Xi:mk(),Yr:mk(),Yi:mk()}));
    this.has1=false; this.Sc=0.5; this.dt=0.5; this.t=0; this.k0=1;
    this.absW=Math.max(14,Math.round(N/14)); this.ab=absorber(N, this.absW, 0.05); this.U0=1;
  }
  setK(k0){ this.k0=k0; }
  get speed(){ return 1; }
  init(p, cell){
    const N=this.N, F=this.F[0], cb=Math.cos(p.beta), sb=Math.sin(p.beta), k=p.k, dt=this.dt;
    const E=(x,y,t)=>{ const u=x-p.x0-cb*t, v=y-p.y0-sb*t;
      /* envelope in rotated frame (along / across propagation) */
      const ua=u*cb+v*sb, va=-u*sb+v*cb, A=Math.exp(-ua*ua/(4*p.sx*p.sx)-va*va/(4*p.sy*p.sy)), ph=k*(cb*x+sb*y-t);
      return [A*Math.cos(ph), A*Math.sin(ph)]; };
    for (let j=0;j<N;j++) for (let i=0;i<N;i++){
      const s=j*N+i; let e=E(i,j,0); F.Er[s]=e[0]; F.Ei[s]=e[1];
      e=E(i,j+0.5,-dt/2); F.Xr[s]=sb*e[0]; F.Xi[s]=sb*e[1];
      e=E(i+0.5,j,-dt/2); F.Yr[s]=-cb*e[0]; F.Yi[s]=-cb*e[1];
      if (cell[s]===WALL){ F.Er[s]=F.Ei[s]=0; }
    }
    for (const a of Object.values(this.F[1])) a.fill(0);
    this.has1=false; this.t=0; this.U0=this.energy();
  }
  energy(){ const A=this.F[0], B=this.F[1], two=this.has1; let u=0;
    for (let s=0;s<A.Er.length;s++){ for (const k of ['Er','Ei','Xr','Xi','Yr','Yi']){ const a=A[k][s], b=two?B[k][s]:0; u+=0.5*(a*a+b*b); } } return u; }
  norm(){ return this.energy()/this.U0; }
  upd(E,X,Y){
    const N=this.N, S=this.Sc;
    for (let j=0;j<N-1;j++){ const o=j*N; for (let i=0;i<N-1;i++){ const s=o+i; X[s]-=S*(E[s+N]-E[s]); Y[s]+=S*(E[s+1]-E[s]); } }
    for (let j=1;j<N-1;j++){ const o=j*N; for (let i=1;i<N-1;i++){ const s=o+i; E[s]+=S*((Y[s]-Y[s-1])-(X[s]-X[s-N])); } }
  }
  step(ch, cell){
    if (ch.tag && !this.has1) this.has1=true;
    for (let c=0;c<(this.has1?2:1);c++){ const F=this.F[c]; this.upd(F.Er,F.Xr,F.Yr); this.upd(F.Ei,F.Xi,F.Yi); }
    /* local operators once per step (ch holds full-step values) */
    const A=this.F[0], B=this.F[1], ab=this.ab, two=this.has1;
    const keys=['E','X','Y'];
    for (let s=0;s<cell.length;s++){
      const c=cell[s];
      if (c===WALL){ A.Er[s]=A.Ei[s]=0; if (two){ B.Er[s]=B.Ei[s]=0; } continue; }
      const a=ab[s];
      if (a!==1){ for (const k of keys){ A[k+'r'][s]*=a; A[k+'i'][s]*=a; if (two){ B[k+'r'][s]*=a; B[k+'i'][s]*=a; } } }
      if (c===CH_U){
        for (const k of keys){
          let a0=A[k+'r'][s], b0=A[k+'i'][s], a1=B[k+'r'][s], b1=B[k+'i'][s];
          if (two){ const c2=ch.mc, s2=ch.ms, na0=c2*a0-s2*a1, nb0=c2*b0-s2*b1; a1=s2*a0+c2*a1; b1=s2*b0+c2*b1; a0=na0; b0=nb0; }
          const pc=ch.pc*ch.aU, ps=ch.ps*ch.aU;
          A[k+'r'][s]=a0*pc-b0*ps; A[k+'i'][s]=a0*ps+b0*pc;
          if (two){ B[k+'r'][s]=a1*pc-b1*ps; B[k+'i'][s]=a1*ps+b1*pc; }
        }
      } else if (c===CH_L && ch.aL!==1){
        for (const k of keys){ A[k+'r'][s]*=ch.aL; A[k+'i'][s]*=ch.aL; if (two){ B[k+'r'][s]*=ch.aL; B[k+'i'][s]*=ch.aL; } }

  /* time-averaged Poynting flux S·n = Re(E H*)·n, normalised by initial energy */
  fluxCell(s, nx, ny, out){
    const N=this.N, sc=1/this.U0;
    const sn=(F,w0,G,w1)=>{ /* combination w0*F + w1*G */
      const er=w0*F.Er[s]+(G?w1*G.Er[s]:0), ei=w0*F.Ei[s]+(G?w1*G.Ei[s]:0);
      const hxr=0.5*(w0*(F.Xr[s]+F.Xr[s-N])+(G?w1*(G.Xr[s]+G.Xr[s-N]):0)), hxi=0.5*(w0*(F.Xi[s]+F.Xi[s-N])+(G?w1*(G.Xi[s]+G.Xi[s-N]):0));
      const hyr=0.5*(w0*(F.Yr[s]+F.Yr[s-1])+(G?w1*(G.Yr[s]+G.Yr[s-1]):0)), hyi=0.5*(w0*(F.Yi[s]+F.Yi[s-1])+(G?w1*(G.Yi[s]+G.Yi[s-1]):0));
      const Sx=-(er*hyr+ei*hyi), Sy=(er*hxr+ei*hxi);

    if (!this.has1){ const v=sn(A,1,null,0); out[0]=v; out[1]=v/2; out[2]=v/2; return; }
    const q=Math.SQRT1_2; out[0]=sn(A,1,null,0)+sn(B,1,null,0); out[1]=sn(A,q,B,q); out[2]=sn(A,q,B,-q);
  }
  fieldArrays(){ return [this.F[0].Er,this.F[0].Ei,this.F[1].Er,this.F[1].Ei]; }
  densityAt(s){ const A=this.F[0]; let d=A.Er[s]*A.Er[s]+A.Ei[s]*A.Ei[s]; if (this.has1){ const B=this.F[1]; d+=B.Er[s]*B.Er[s]+B.Ei[s]*B.Ei[s]; } return d; }
  dispAt(s,out){ out[0]=this.F[0].Er[s]; out[1]=this.F[0].Ei[s]; }
  snapshotArrays(){ const out=[]; for (let c=0;c<(this.has1?2:1);c++){ const F=this.F[c]; out.push(F.Er,F.Ei,F.Xr,F.Xi,F.Yr,F.Yi); } return out; }
}

const Hpl=6.62607015e-34, HB=Hpl/(2*Math.PI), C0=299792458, EV=1.602176634e-19, AMU=1.66053906660e-27, QE=1.602176634e-19, ME=9.1093837015e-31;

  electron:{name:'Electron', m:ME, q:-QE, Ek:50e3*EV},
  neutron:{name:'Neutron', m:1.67492749804e-27, q:0, Ek:0.0025*EV},
  helium:{name:'Helium-4 atom', m:6.6446573357e-27, q:0, Ek:0.06*EV},
  c60:{name:'C₆₀ fullerene', m:720.66*AMU, q:0, Ek:0.5*720.66*AMU*220*220},
  custom:{name:'Custom mass', m:100*AMU, q:0, Ek:0.02*EV},
  photon:{name:'Photon', m:0, q:0, lam:550e-9}

function particleState(P){
  const t=P.ptype, o={type:t, name:PT[t].name, photon:t==='photon'};
  if (o.photon){ o.lam=P.lam; o.E=Hpl*C0/o.lam; o.f=C0/o.lam; o.p=Hpl/o.lam; o.v=C0; o.m=0; o.q=0; o.Ek=o.E; o.gamma=Infinity; }
  else { o.m = t==='custom' ? P.mu*AMU : PT[t].m; o.q = t==='custom' ? P.qe*QE : PT[t].q; o.Ek=P.Ek;
    const mc2=o.m*C0*C0, Et=o.Ek+mc2; o.p=Math.sqrt(o.Ek*o.Ek+2*o.Ek*mc2)/C0; o.lam=Hpl/o.p; o.v=o.p*C0*C0/Et; o.gamma=Et/mc2;
    o.f=o.Ek/Hpl; o.E=o.Ek; }

}
function ekFromV(m,v){ const g=1/Math.sqrt(1-v*v/(C0*C0)); return (g-1)*m*C0*C0; }

  tU:1, tL:1, phi:0, theta:0,

const rnd = () => Math.random();

function cells(lam){ return lam*S.LAM; }
function geomCells(){
  const N=S.N, L=S.LAM, maxX=N/L;

/* =====================================================================
   MARKER (exact which-path information by path decomposition)
   With θ > 0 a second, identical simulation runs with the upper slit closed. It gives ψ_L, the amplitude that
   reaches any point through the lower slit; the upper-path amplitude is ψ_U = ψ − ψ_L. With marker states
   ⟨χ_L|χ_U⟩ = cos θ, written in an orthonormal basis: Ψ = A|0⟩ + B|1⟩ with A = ψ_L + cos θ ψ_U, B = sin θ ψ_U.
   ρ = |A|² + |B|², and a later marker measurement in the ± basis selects (A ± B)/√2 (the quantum eraser).
   This is exact up to the (tiny) near-field coupling between the two slits.
   ===================================================================== */
function ensureMarker(){
  const need=P.theta>0 && P.openU && P.openL && P.tU>0 && P.tL>0;
  if (need && !S.eng2){ S.eng2 = S.eng.kind==='fdtd' ? new FDTD(S.N) : new TDSE(S.N); S.geo2=new Geometry(S.N); return true; }
  if (!need && S.eng2){ S.eng2=null; S.geo2=null; return true; }
  return false;
}
function buildGeo2(){ if (S.geo2){ const g=geomCells(); g.openU=false; S.geo2.build(g); } }

function cellVals(e,s,o){
  const N=e.N;
  if (e.kind==='tdse'){ const r=e.r[0], i=e.i[0]; o[0]=r[s]; o[1]=i[s]; o[2]=(r[s+1]-r[s-1])/2; o[3]=(i[s+1]-i[s-1])/2; o[4]=(r[s+N]-r[s-N])/2; o[5]=(i[s+N]-i[s-N])/2; }
  else { const F=e.F[0]; o[0]=F.Er[s]; o[1]=F.Ei[s]; o[2]=0.5*(F.Xr[s]+F.Xr[s-N]); o[3]=0.5*(F.Xi[s]+F.Xi[s-N]); o[4]=0.5*(F.Yr[s]+F.Yr[s-1]); o[5]=0.5*(F.Yi[s]+F.Yi[s-1]); }
}
function flx(v,nx,ny,kind,U0){
  if (kind==='tdse') return nx*(v[0]*v[3]-v[1]*v[2]) + ny*(v[0]*v[5]-v[1]*v[4]);
  return (nx*(-(v[0]*v[4]+v[1]*v[5])) + ny*(v[0]*v[2]+v[1]*v[3]))/U0;
}
function markerSplit(){
  const c=Math.cos(P.theta*Math.PI/180), z=Math.sin(P.theta*Math.PI/180), q=Math.SQRT1_2;
  for (let k=0;k<6;k++){ const u=VT[k]-VL[k]; VA[k]=VL[k]+c*u; VB[k]=z*u; VP[k]=q*(VA[k]+VB[k]); VM[k]=q*(VA[k]-VB[k]); }
}
function fluxComb(s,nx,ny,out){
  const e=S.eng; if (!S.eng2){ e.fluxCell(s,nx,ny,out); return; }
  cellVals(e,s,VT); cellVals(S.eng2,s,VL); markerSplit();
  const k=e.kind, U0=e.U0||1; out[0]=flx(VA,nx,ny,k,U0)+flx(VB,nx,ny,k,U0); out[1]=flx(VP,nx,ny,k,U0); out[2]=flx(VM,nx,ny,k,U0);
}
function densComb(s){ const e=S.eng; if (!S.eng2) return e.densityAt(s);
  const a=S.eng.fieldArrays(), b=S.eng2.fieldArrays(), c=Math.cos(P.theta*Math.PI/180), z=Math.sin(P.theta*Math.PI/180);
  const lr=b[0][s], li=b[1][s], ur=a[0][s]-lr, ui=a[1][s]-li, Ar=lr+c*ur, Ai=li+c*ui; return Ar*Ar+Ai*Ai+z*z*(ur*ur+ui*ui); }
function dispComb(s,out){ const e=S.eng; if (!S.eng2){ e.dispAt(s,out); return; }
  const a=e.fieldArrays(), b=S.eng2.fieldArrays(), c=Math.cos(P.theta*Math.PI/180);
  out[0]=b[0][s]+c*(a[0][s]-b[0][s]); out[1]=b[1][s]+c*(a[1][s]-b[1][s]); }
function binsReset(){ const b=P.bins; S.acc=new Float64Array(b); S.accP=new Float64Array(b); S.accM=new Float64Array(b); S.events=[]; S.pins=S.pins.filter(p=>p.bins===b); }

function channelFor(run){
  /* Per-step coefficients in the slit channels. One passage through the barrier (thickness T) gives the relative phase φ
     and the amplitudes tU, tL. Fraction per step = v_g·dt / T, where v_g is the group velocity of the fundamental mode
     of a slit of width w (it acts as a short waveguide): v_g = v·√(1 − (λ/2w)²).
     The which-path marker is handled exactly by path decomposition (see MARKER below), not inside the engine. */
  const e=S.eng, T=Math.max(1,P.T*S.LAM), lamC=2*Math.PI/run.k, half = e.kind==='tdse' ? 0.5 : 1;
  const vg=w=>Math.sqrt(Math.max(0.05, 1-Math.pow(lamC/(2*Math.max(w,1e-3)),2)));
  const fU=e.speed*vg(P.wU*S.LAM)*e.dt/T*half, fL=e.speed*vg(P.wL*S.LAM)*e.dt/T*half, phi=P.phi*Math.PI/180*fU;
  return { pc:Math.cos(phi), ps:Math.sin(phi), aU:Math.pow(Math.max(P.tU,1e-9), fU), aL:Math.pow(Math.max(P.tL,1e-9), fL), tag:false, mc:1, ms:0 };
}

function startRun(){
  const e=S.eng, N=S.N, L=S.LAM, ph=particleState(P);
  /* source coherence and bandwidth: each emitted particle gets its own wavelength and direction */
  const dl = P.bw/100 * gauss();
  const lamC = L*(1+dl);
  const k = 2*Math.PI/lamC;
  const sigTh = 1/(2*Math.PI*Math.max(P.lc,0.01));       /* σθ = λ/(2π ℓc) */
  const beta = P.inc*Math.PI/180 + (P.lc<199 ? sigTh*gauss() : 0);
  e.setK(k);
  const xs=sourcePos()*L, ys=N/2 - Math.tan(P.inc*Math.PI/180)*(P.xb-sourcePos())*L;
  const p={x0:xs, y0:ys, sx:P.sx*L, sy:P.sy*L, kx:k*Math.cos(beta), ky:k*Math.sin(beta), k, beta};
  e.init(p, S.geo.cell);
  ensureMarker(); if (S.eng2){ buildGeo2(); S.eng2.setK(k); S.eng2.init(p, S.geo2.cell); }
  const b=P.bins;
  S.run = { p, ph, dl, beta, k, u:rnd(), uSet:!P.postsel, Pb:1, cum:0, det:null, steps:0, done:false, cumScreen:0, maxSteps:0, flash:0 };
  S.runAcc=new Float64Array(b); S.runAccP=new Float64Array(b); S.runAccM=new Float64Array(b);
  const sg=screenGeom(); const dist=(sg.xs-sourcePos()+P.sx*4+Math.abs(sg.W/2*Math.sin(sg.a)))*L;
  S.run.maxSteps = Math.ceil(1.3*dist/(e.speed*e.dt));
  S.snaps=[]; S.stepCount=0; snapshot();
  initTraj();
}

/* screen sampling */
const _f=[0,0,0];
function screenFlux(){
  const e=S.eng, N=S.N, L=S.LAM, sg=screenGeom(), b=P.bins, sub=2, ds=sg.W*L/(b*sub);
  const xc=sg.xs*L, yc=N/2, dt=e.dt;
  const st=S.runStep || (S.runStep={t:new Float64Array(b), p:new Float64Array(b), m:new Float64Array(b)});
  if (st.t.length!==b){ st.t=new Float64Array(b); st.p=new Float64Array(b); st.m=new Float64Array(b); }
  st.t.fill(0); st.p.fill(0); st.m.fill(0); let tot=0;
  for (let k=0;k<b*sub;k++){
    const sPos=(-sg.W/2 + (k+0.5)*sg.W/(b*sub))*L;
    const x=xc+sg.tx*sPos, y=yc+sg.ty*sPos;
    const i=Math.floor(x), j=Math.floor(y); if (i<2||j<2||i>=N-3||j>=N-3) continue;
    const fx=x-i, fy=y-j; let jt=0,jp=0,jm=0;
    for (let dj=0;dj<2;dj++) for (let di=0;di<2;di++){
      const w=(di?fx:1-fx)*(dj?fy:1-fy); fluxComb((j+dj)*N+i+di, sg.nx, sg.ny, _f);
      jt+=w*_f[0]; jp+=w*_f[1]; jm+=w*_f[2];
    }
    const bi=Math.floor(k/sub), d=ds*dt;
    if (jt>0){ st.t[bi]+=jt*d; tot+=jt*d; }
    if (jp>0) st.p[bi]+=jp*d; if (jm>0) st.m[bi]+=jm*d;
  }
  return tot;
}

function stepSim(){
  const R=S.run; if (!R || R.done) return;
  const e=S.eng;
  const ch=channelFor(R); e.step(ch, S.geo.cell); if (S.eng2) S.eng2.step(ch, S.geo2.cell);
  R.steps++; S.stepCount++;
  const dP=screenFlux(), st=S.runStep;
  for (let i=0;i<P.bins;i++){ S.runAcc[i]+=st.t[i]; S.runAccP[i]+=st.p[i]; S.runAccM[i]+=st.m[i]; }
  R.cumScreen+=dP;
  /* Post-selection: once the packet has fully met the barrier, keep only the part that got through:
     u is drawn from [0, P_through), so a particle that passes is detected with probability η (it may still miss the screen). */
  if (!R.uSet){ const L=S.LAM, g=geomCells();
    if (R.steps*e.speed*e.dt > (g.xb+g.T) - R.p.x0 + 3.5*R.p.sx){
      let pb=0; const N=S.N, x0=Math.ceil(g.xb+g.T); for (let j=0;j<N;j++) for (let i=x0;i<N;i++) pb+=densComb(j*N+i);
      R.Pb=Math.max(pb + R.cumScreen*0, 1e-9); R.u*=R.Pb; R.uSet=true; } }
  /* Born rule, sampled in time: detection happens when the accumulated arrival probability (× efficiency) passes u */
  if (!R.det && dP>0 && R.uSet){
    const before=R.cum; R.cum += P.eta*dP;
    if (R.cum>=R.u && !(S.mode==='cont' && P.accel>1)){
      detectFrom(st.t, st.p, st.m, dP);
      if (P.collapse) collapseAt();
    }
  }
  stepTraj();
  if (S.stepCount % S.snapEvery===0) snapshot();
  if (R.steps>=R.maxSteps || (R.steps>20 && R.steps%10===0 && e.norm()<2e-3)) finishRun();
}
function pickBin(arr, total){ let x=rnd()*total; for (let i=0;i<arr.length;i++){ x-=arr[i]; if (x<=0) return i; } return arr.length-1; }
function detectFrom(t,p,m,total){
  const sg=screenGeom(), b=P.bins, bi=pickBin(t,total);
  const pp=p[bi], mm=m[bi], tag = rnd()*(pp+mm) < pp ? 'plus' : 'minus';
  const s=-sg.W/2 + (bi+rnd())*sg.W/b;
  const ev={bin:bi, s, tag, z:rnd()}; S.events.push(ev); S.acc[bi]++; (tag==='plus'?S.accP:S.accM)[bi]++;
  S.run.det=ev; S.run.flash=1; addHit3D(ev);
}
function collapseAt(){
  /* after a detector click the particle is absorbed: no more wave to show */
  for (const e of [S.eng,S.eng2]){ if (!e) continue; for (const a of e.fieldArrays()) a.fill(0);
    if (e.kind==='fdtd'){ for (const F of e.F) for (const a of Object.values(F)) a.fill(0); } }
}
function finishRun(){
  const R=S.run; R.done=true;
  if (S.mode==='cont' && P.accel>1){
    /* accelerated statistics: K independent particles with the same quantum state → K draws from the same distribution */
    const tot=S.runAcc.reduce((a,b)=>a+b,0);
    const pass = P.postsel ? tot/Math.max(R.Pb,1e-9) : tot;
    for (let k=0;k<P.accel;k++){ if (rnd() < P.eta*Math.min(1,pass)) detectFromAcc(tot); }
  }
  snapshot();
  if (S.mode==='cont'){ if (S.events.length < P.nEmit){ startRun(); } else { toast(`Done: ${S.events.length} particles detected.`); } }
  else { if (!R.det) toast(P.postsel? 'This particle passed the slits but missed the screen or the detector: no click.' : 'No click: the particle was stopped by the barrier, reflected, or missed the detector.'); if (S.loop) startRun(); }
}
function detectFromAcc(tot){
  const sg=screenGeom(), b=P.bins, bi=pickBin(S.runAcc, tot), pp=S.runAccP[bi], mm=S.runAccM[bi];
  const tag = rnd()*(pp+mm) < pp ? 'plus':'minus', s=-sg.W/2+(bi+rnd())*sg.W/b, ev={bin:bi,s,tag,z:rnd()};
  S.events.push(ev); S.acc[bi]++; (tag==='plus'?S.accP:S.accM)[bi]++; addHit3D(ev);
}

/* snapshots for the timeline / step back */
function snapshot(){
  const arrs=S.eng.snapshotArrays().concat(S.eng2? S.eng2.snapshotArrays() : []);
  const snap={ t:S.eng.t, steps:S.run.steps, stepCount:S.stepCount, has1:S.eng.has1, data:arrs.map(a=>Float32Array.from(a)),
    run:{cum:S.run.cum, cumScreen:S.run.cumScreen, det:S.run.det, done:S.run.done, u:S.run.u, uSet:S.run.uSet, Pb:S.run.Pb},
    acc:[Float64Array.from(S.runAcc),Float64Array.from(S.runAccP),Float64Array.from(S.runAccM)], nev:S.events.length,
    traj:S.traj.map(t=>({x:t.x,y:t.y,n:t.pts.length,alive:t.alive})) };
  const bytes=snap.data.reduce((s,a)=>s+a.byteLength,0);
  S.maxSnaps = Math.max(8, Math.floor(90e6/bytes));
  S.snaps.push(snap); if (S.snaps.length>S.maxSnaps) S.snaps.shift();
  updTimeline();
}
function restore(k){
  const sn=S.snaps[k]; if (!sn) return;
  const e=S.eng; e.has1=sn.has1;
  const arrs=e.snapshotArrays().concat(S.eng2? S.eng2.snapshotArrays() : []); if (S.eng2) S.eng2.t=sn.t;
  arrs.forEach((a,i)=>{ if (sn.data[i]) a.set(sn.data[i]); });
  if (!sn.has1){ if (e.kind==='tdse'){ e.r[1].fill(0); e.i[1].fill(0); } else for (const a of Object.values(e.F[1])) a.fill(0); }
  e.t=sn.t; S.run.steps=sn.steps; S.stepCount=sn.stepCount; Object.assign(S.run, sn.run);
  S.runAcc.set(sn.acc[0]); S.runAccP.set(sn.acc[1]); S.runAccM.set(sn.acc[2]);
  /* remove detections made after this snapshot */
  while (S.events.length>sn.nev){ const ev=S.events.pop(); S.acc[ev.bin]--; (ev.tag==='plus'?S.accP:S.accM)[ev.bin]--; }
  rebuildHits3D();
  sn.traj.forEach((t,i)=>{ const T=S.traj[i]; if (!T) return; T.x=t.x; T.y=t.y; T.pts.length=t.n; T.alive=t.alive; });
  S.snaps.length=k+1; updTimeline();
}

/* de Broglie–Bohm trajectories (one interpretation): dx/dt = Im(ψ*∇ψ)/|ψ|² with ħ/m = 1 */
function initTraj(){
  S.traj=[]; if (!P.bohm || S.eng.kind!=='tdse') return;
  const p=S.run.p, L=S.LAM, N=S.N, sl=[]; if (P.openU&&P.tU>0) sl.push([P.yU,P.wU]); if (P.openL&&P.tL>0) sl.push([P.yL,P.wL]);
  /* Bohmian paths never cross, so starting points in line with a slit (weighted by |ψ|²) give the transmitted family */
  for (let k=0;k<70;k++){ const [yc,w]=sl[k%Math.max(1,sl.length)]||[0,1];
    let y; for (let t=0;t<30;t++){ y=N/2+(yc+(rnd()-0.5)*w*0.9)*L; if (rnd()<Math.exp(-((y-p.y0)**2)/(2*p.sy*p.sy))) break; }
    const x=p.x0+gauss()*p.sx*0.8; S.traj.push({x,y,pts:[[x,y]],alive:true}); }
}
const _v=[0,0,0];
function stepTraj(){
  if (!S.traj.length || S.eng2) return;
  const e=S.eng, dt=e.dt;
  for (const t of S.traj){ if (!t.alive) continue;
    e.velocityAt(t.x,t.y,_v); const mx=t.x+_v[0]*dt/2, my=t.y+_v[1]*dt/2; e.velocityAt(mx,my,_v);
    if (_v[2]<1e-16){ t.alive=false; continue; }
    t.x+=_v[0]*dt; t.y+=_v[1]*dt;
    if (S.stepCount%2===0) t.pts.push([t.x,t.y]);
    if (t.x<3||t.y<3||t.x>S.N-4||t.y>S.N-4) t.alive=false;
  }
}

/* =====================================================================
   DISPLAY BUFFER (shared by the 3D and 2D views): RGBA = |ψ|, cos φ, sin φ, |ψ|²
   ===================================================================== */
let BUF=null, BUFN=0, refDens=1;
function fillBuffer(){
  const e=S.eng, N=S.N; if (BUFN!==N){ BUF=new Uint8Array(N*N*4); BUFN=N; }
  let mx=0; const dv=[0,0];
  const dens=new Float32Array(N*N);
  for (let s=0;s<N*N;s++){ const d=densComb(s); dens[s]=d; if (d>mx) mx=d; }
  if (S.eng.t===0 || refDens<=0) refDens=mx||1;
  const ref = P.auto ? (mx||1) : refDens/P.gain;
  for (let s=0;s<N*N;s++){
    dispComb(s,dv); const d=Math.min(1,dens[s]/ref), a=Math.sqrt(d), ph=Math.atan2(dv[1], dv[0]), o=s*4;
    BUF[o]=a*255; BUF[o+1]=(0.5+0.5*Math.cos(ph))*255; BUF[o+2]=(0.5+0.5*Math.sin(ph))*255; BUF[o+3]=d*255;
  }
  S.dispMax=mx; S.dispRef=ref;
}

/* =====================================================================
   UI: controls
   ===================================================================== */
const $=id=>document.getElementById(id);
const fmt=(x,d=3)=>{ if (!isFinite(x)) return '—'; const a=Math.abs(x); if (a!==0 && (a<1e-3||a>=1e5)) return x.toExponential(d-1).replace('e',' × 10^').replace(/\^([+-]?)(\d+)/,(_,s,n)=>'<sup>'+(s==='-'?'−':'')+n+'</sup>'); return (+x.toPrecision(d)).toString(); };
const PFX=[[1e12,'T'],[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p'],[1e-15,'f'],[1e-18,'a']];
function si(x,u,d=3){ if (!isFinite(x)) return '—'; if (x===0) return '0 '+u; const a=Math.abs(x); for (const [f,p] of PFX) if (a>=f*0.9995) return (x/f).toPrecision(d)+' '+p+u; return x.toExponential(2)+' '+u; }

const CTRL={};  /* key → {set(v)} for syncing */
function row(parent, key, label, min, max, step, unit, kind, opts={}){
  const d=document.createElement('div'); d.className='row'; const id='p-'+key;
  const lab = unit? `${label} <small>(${unit})</small>` : label;
  d.innerHTML=`<label for="${id}">${lab}</label><input type="number" id="${id}-n" min="${min}" max="${max}" step="${step}" aria-label="${label}"><input type="range" id="${id}" min="${opts.log?Math.log10(min):min}" max="${opts.log?Math.log10(max):max}" step="${opts.log?0.01:step}">`;
  parent.appendChild(d);
  const r=d.querySelector('input[type=range]'), n=d.querySelector('input[type=number]');
  const get=()=>opts.get?opts.get():P[key];
  const setv=v=>{ if (opts.set) opts.set(v); else P[key]=v; };
  const sync=()=>{ const v=get(); n.value=opts.dec!=null? (+v).toFixed(opts.dec) : +(+v).toPrecision(4); r.value=opts.log?Math.log10(v):v; };
  r.oninput=()=>{ let v=opts.log?Math.pow(10,+r.value):+r.value; setv(v); sync(); changed(key,kind); };
  n.onchange=()=>{ let v=+n.value; if (!isFinite(v)) return sync(); v=Math.min(max,Math.max(min,v)); setv(v); sync(); changed(key,kind); };
  CTRL[key]={sync}; sync(); return d;
}
function toggle(parent, key, label, kind){
  const l=document.createElement('label'); l.className='tog'; l.innerHTML=`<span>${label}</span><input type="checkbox" id="p-${key}">`; parent.appendChild(l);
  const c=l.querySelector('input'); c.checked=!!P[key]; c.onchange=()=>{ P[key]=c.checked; changed(key,kind); };
  CTRL[key]={sync(){ c.checked=!!P[key]; }};
}
function hint(parent, html){ const p=document.createElement('p'); p.className='hint'; p.innerHTML=html; parent.appendChild(p); return p; }
function group(title, open=true){ const d=document.createElement('details'); d.className='grp'; d.open=open; d.innerHTML=`<summary>${title}</summary>`; $('left').appendChild(d); return d; }

  row(linkBox,'lamM','de Broglie λ',0.1,1e6,0.01,'pm','packet',{log:true,get:()=>particleState(P).lam*1e12,set:v=>{ const m=particleState(P).m; P.Ek=ekFromLam(m,v*1e-12); }});
  const phBox=document.createElement('div'); g.appendChild(phBox);
  row(phBox,'lam','Wavelength λ',100,2000,1,'nm','packet',{get:()=>P.lam*1e9,set:v=>{P.lam=v*1e-9;}});

  row(g,'sx','Packet length σₓ',0.5,6,0.1,'λ','packet');

  row(g,'bw','Bandwidth Δλ/λ',0,20,0.5,'%','packet');
  row(g,'lc','Transverse coherence ℓc',0.5,200,0.5,'λ','packet',{log:true});
  hint(g,'Each new particle gets its own λ and direction drawn from these spreads. Low coherence or wide bandwidth washes out the fringes in the accumulated pattern.');

function build3D(){

    vertexShader:`uniform sampler2D uTex; uniform float uH; uniform int uHM; varying vec4 vD;
      void main(){ vec4 d=texture2D(uTex,uv); vD=d; float h = uHM==0 ? d.a : d.r*(d.g*2.0-1.0)*0.6;

    fragmentShader:`uniform int uCM; varying vec4 vD;
      vec3 hue(float a){ return 0.5+0.5*cos(6.28318*(a+vec3(0.0,0.333,0.667))); }
      vec3 inf(float t){ t=clamp(t,0.,1.); return vec3(clamp(1.6*t-0.05,0.,1.), clamp(1.5*t*t+0.1*t,0.,1.)*0.92, clamp(0.55*sin(3.3*t)+0.15+0.7*t*t*t,0.,1.)); }

  R3.hits=new THREE.Points(hg,new THREE.PointsMaterial({color:0xffffff,size:0.12,transparent:true,opacity:0.95})); R3.hits.frustumCulled=false; grp.add(R3.hits);

}
function update3DGeometry(){

  R3.handles=[];

    const l=label3(P.theta>0?`marker θ=${P.theta}°`:(P.phi!==0?`φ=${P.phi}°`:`t=${P.tU}`), P.theta>0?'#6ee7a8':'#7fd1ff',0.5); l.position.copy(W3(xb+T/2,P.yU,sh+0.8)); O.add(l); }

  const se=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(sg.W,P.scrH)),new THREE.LineBasicMaterial({color:'#5d6d80'})); se.position.copy(scr.position); se.rotation.copy(scr.rotation); O.add(se);

  mkH('slitU',W3(xb+T/2,P.yU,sh+0.35),'#7fd1ff'); mkH('slitL',W3(xb+T/2,P.yL,sh+0.35),'#7fd1ff');

function hitWorld(ev){ const sg=screenGeom(); return W3(sg.xs+sg.tx*ev.s, sg.ty*ev.s, ev.z*P.scrH); }
function addHit3D(ev){ if (!R3||!R3.hits) return; const g=R3.hits.geometry, n=g.drawRange.count; if (n>=30000) return;
  const p=hitWorld(ev), a=g.attributes.position.array; a[n*3]=p.x; a[n*3+1]=p.y; a[n*3+2]=p.z; g.attributes.position.needsUpdate=true; g.setDrawRange(0,n+1);

/* direct manipulation in 3D */
function setupDrag(){
  const cv=$('gl'), ray=new THREE.Raycaster(), m=new THREE.Vector2(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),0), hit=new THREE.Vector3();
  const pick=e=>{ const r=cv.getBoundingClientRect(); m.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(m,R3.camera); };
  const toSim=()=>{ R3.app.updateMatrixWorld(); const inv=new THREE.Matrix4().copy(R3.app.matrixWorld).invert();
    const pl=plane.clone().applyMatrix4(R3.app.matrixWorld); if (!ray.ray.intersectPlane(pl,hit)) return null; const p=hit.clone().applyMatrix4(inv); const Lx=S.N/S.LAM; return {x:p.x+Lx/2, y:-p.z}; };
  cv.addEventListener('pointerdown',e=>{ if (!R3) return; pick(e); const it=ray.intersectObjects(R3.handles,false); if (!it.length) return;
    R3.drag=it[0].object.userData.h; R3.controls.enabled=false; cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove',e=>{ if (!R3||!R3.drag) { if (R3){ pick(e); cv.style.cursor = ray.intersectObjects(R3.handles,false).length?'grab':''; } return; }
    pick(e); const q=toSim(); if (!q) return; const r=v=>Math.round(v*20)/20; const k=R3.drag; let key=null, kind='geom';
    if (k==='slitU'){ P.yU=r(q.y); key='yU'; } else if (k==='slitL'){ P.yL=r(q.y); key='yL'; }
    else if (k==='wU'){ P.wU=Math.max(0.2,r(2*(q.y-P.yU))); key='wU'; } else if (k==='wL'){ P.wL=Math.max(0.2,r(2*(P.yL-q.y))); key='wL'; }
    else if (k==='bar'){ const old=P.xb; P.xb=Math.min(18,Math.max(3,r(q.x-P.T/2))); P.Ls=Math.max(0.5,P.Ls-(P.xb-old)); key='xb'; }
    else if (k==='src'){ P.Ds=Math.min(12,Math.max(1.5,r(P.xb-(q.x+1.2)))); key='Ds'; kind='packet'; }
    else if (k==='scr'){ P.Ls=Math.min(16,Math.max(0.5,r(q.x-P.xb-P.T))); key='Ls'; }
    else if (k==='rot'){ const sg=screenGeom(); const ang=Math.atan2(-(q.x-sg.xs), q.y)*180/Math.PI; P.alpha=Math.max(-40,Math.min(40,Math.round(ang*2)/2)); key='alpha'; }
    if (key){ if (CTRL[key]) CTRL[key].sync(); CTRL.sep.sync(); CTRL.Ls&&CTRL.Ls.sync(); if (kind==='packet'){ clearTimeout(R3._pt); R3._pt=setTimeout(()=>changed(key,'packet'),200); update3DGeometry(); } else changed(key,kind); } });
  const end=e=>{ if (R3&&R3.drag){ R3.drag=null; R3.controls.enabled=true; } };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
}

function render3D(dt){

const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;

function buildEqTab(){
  $('vEq').innerHTML=`
  <h2>The physics in this lab</h2>
  <div class="box"><h5>Massive particles: time-dependent Schrödinger equation</h5>
   <div class="eq"><i>iħ</i>${fr('∂ψ','∂<i>t</i>')} = <i>Ĥ</i>ψ = −${fr('ħ²','2<i>m</i>')}∇²ψ + <i>V</i>ψ</div>
   <p>Free space has <i>V</i> = 0. The barrier is an infinitely high wall (ψ = 0 inside the metal). The slits are the only openings.</p>
   <div class="eq">ρ(<b>x</b>,<i>t</i>) = |ψ(<b>x</b>,<i>t</i>)|², &nbsp; <b>J</b> = ${fr('ħ','<i>m</i>')} Im(ψ*∇ψ), &nbsp; ${fr('∂ρ','∂<i>t</i>')} + ∇·<b>J</b> = 0</div>
   <p>Re ψ and Im ψ oscillate. The phase arg ψ advances along the direction of motion at <i>k</i> = 2π/λ. Only ρ = |ψ|² is a probability density. The probability that the particle arrives at a strip of the screen equals the time-integrated current through it, ∫<b>J</b>·<b>n</b> d<i>s</i> d<i>t</i>.</p>
   <div class="eq">λ = ${fr('<i>h</i>','<i>p</i>')}, &nbsp; <i>p</i> = γ<i>mv</i>, &nbsp; Δ<i>x</i> Δ<i>p</i> ≥ ${fr('ħ','2')}</div></div>
  <div class="box"><h5>Photons: Maxwell’s equations</h5>
   <div class="eq">${fr('∂<b>B</b>','∂<i>t</i>')} = −∇×<b>E</b>, &nbsp; ${fr('∂<b>E</b>','∂<i>t</i>')} = <i>c</i>²∇×<b>B</b> &nbsp; ⇒ &nbsp; ∇²<b>E</b> = ${fr('1','<i>c</i>²')}${fr('∂²<b>E</b>','∂<i>t</i>²')}</div>
   <p>A photon has no non-relativistic Schrödinger wavefunction. Its single-photon wavepacket propagates like a classical field mode. The probability of a detector click is proportional to the local intensity |<i>E</i><sup>(+)</sup>|² (Glauber’s photodetection theory). The lab solves Maxwell’s equations for <i>E</i><sub>z</sub>, <i>H</i><sub>x</sub>, <i>H</i><sub>y</sub> and uses the time-averaged Poynting flux <b>S</b>·<b>n</b> at the screen as the detection probability.</p></div>
  <div class="box"><h5>Two slits: adding amplitudes, not probabilities</h5>
   <div class="eq">ψ = ψ<sub>1</sub> + ψ<sub>2</sub> &nbsp; ⇒ &nbsp; |ψ|² = |ψ<sub>1</sub>|² + |ψ<sub>2</sub>|² + 2 Re(ψ<sub>1</sub>*ψ<sub>2</sub>)</div>
   <p>The last term is the interference. It needs both alternatives to stay indistinguishable. The particle is never shown as two particles: there is one wavefunction, and it is non-zero behind both openings.</p>
   <div class="eq">Δ<i>y</i> ≈ ${fr('λ<i>L</i>','<i>d</i>')} &nbsp; (far field, <i>L</i> ≫ <i>d</i>²/λ)</div></div>
  <div class="box"><h5>Which-path marker, complementarity, eraser</h5>
   <div class="eq">Ψ = ψ<sub>1</sub>|χ<sub>1</sub>⟩ + ψ<sub>2</sub>|χ<sub>2</sub>⟩, &nbsp; ⟨χ<sub>1</sub>|χ<sub>2</sub>⟩ = cos θ</div>
   <div class="eq">ρ = |ψ<sub>1</sub>|² + |ψ<sub>2</sub>|² + 2 cos θ · Re(ψ<sub>1</sub>*ψ<sub>2</sub>), &nbsp; <i>D</i>² + <i>V</i>² ≤ 1</div>
   <p>The marker is an internal state (spin, polarisation, atomic level) that ends up different for the upper path: |χ<sub>1</sub>⟩ for the lower slit, |χ<sub>2</sub>⟩ for the upper, with overlap cos θ. Sorting the hits by a later measurement of the marker in the ± basis (“Marker +” and “Marker −”) brings back fringes and anti-fringes. Their sum, all hits, never shows fringes when θ = 90°.</p></div>
  <div class="box"><h5>Numerical method</h5><ul>
   <li><b>Schrödinger:</b> split-step Fourier (Strang splitting). Each step is e<sup>−iVΔt/2ħ</sup> · e<sup>−iTΔt/ħ</sup> · e<sup>−iVΔt/2ħ</sup>. The kinetic part is exact in momentum space via a 2D FFT. Units: ħ = m = 1, grid spacing = λ/<i>n</i> (“points per wavelength”), Δt chosen so that <i>k</i>²Δt/2 = 0.2 rad.</li>
   <li><b>Maxwell:</b> Yee FDTD with Courant number 0.5. The analytic (complex) field is propagated by running the in-phase and quadrature parts, which gives the phase and the cycle-averaged intensity.</li>
   <li><b>Boundaries:</b> an absorbing layer (complex absorbing potential for ψ, a matched sponge for the fields) about 2.4 λ wide imitates open space. Without it the Fourier method would make the box periodic.</li>
   <li><b>Detection:</b> one random number <i>u</i> per particle. The click happens when η·∫∫<b>J</b>·<b>n</b> reaches <i>u</i>, at a position drawn from the current flux. This is the Born rule sampled in time. Negative flux (backflow) is ignored.</li>
   <li><b>Phase plate and path amplitudes:</b> applied gradually while the wave crosses the slit channel. The dwell time uses the group velocity of the slit’s fundamental waveguide mode, v√(1 − (λ/2w)²).</li>
   <li><b>Which-path marker (exact):</b> when θ > 0 a second, identical simulation runs in lockstep with the upper slit closed. It gives ψ<sub>L</sub>; the upper-path amplitude is ψ<sub>U</sub> = ψ − ψ<sub>L</sub>. The state Ψ = ψ<sub>L</sub>|χ<sub>1</sub>⟩ + ψ<sub>U</sub>|χ<sub>2</sub>⟩ is then formed exactly, and θ can be changed at any time. The only approximation is the very small near-field coupling between the slits.</li></ul></div>
  <div class="box"><h5>Assumptions and limits</h5><ul>
   <li>2D cross-section: slits are infinitely tall. This is accurate when slit height ≫ width.</li>
   <li>The box holds 13–40 wavelengths, so the screen is usually in the near or Fresnel zone. Real experiments are scaled up enormously; use the far-field readout for real distances.</li>
   <li>Relativistic electrons: the Schrödinger propagation uses the relativistic de Broglie λ and γm, which is correct for the paraxial dynamics here. Spin and magnetic effects are ignored.</li>
   <li>Photon polarisation is treated as a scalar plus a marker component, which is accurate for small diffraction angles.</li>
   <li>Barrier walls are perfect: no surface potentials, image charges or van der Waals forces, which matter for real molecule experiments.</li>
   <li>Partial coherence is modelled as an ensemble: each particle gets a random λ and direction.</li></ul></div>`;
}

const DEB=[
 {y:'1704',t:'arg',who:'Isaac Newton',h:'Light is made of corpuscles',p:'In <i>Opticks</i>, Newton favoured a particle (corpuscle) picture of light. His authority kept the wave view in the minority for about a century.'},
 {y:'1803',t:'exp',who:'Thomas Young',h:'Two openings, alternating bright and dark bands',p:'In his Bakerian Lecture (Royal Society, 1803; published 1804), Young explained fringes from light passing two openings as the superposition of waves: bright where crests meet crests, dark where crests meet troughs.',push:'Henry Brougham attacked Young’s optical papers in the <i>Edinburgh Review</i> (1803–04) as worthless speculation, invoking Newton’s authority. Young’s wave theory was largely ignored until Fresnel.',try:'young',tl:'Try it with light'},
 {y:'1818',t:'crit',who:'Siméon Poisson vs. Augustin Fresnel',h:'The “absurd” bright spot',p:'Judging Fresnel’s wave theory of diffraction, Poisson derived that it predicts a bright spot in the centre of a round shadow and took this as a refutation. François Arago did the experiment and found the spot. The wave theory won.'},
 {y:'1905',t:'arg',who:'Albert Einstein',h:'Light comes in quanta',p:'To explain the photoelectric effect, Einstein proposed that light energy arrives in packets <i>E</i> = <i>hf</i>. In 1909 he argued that light shows both wave and particle fluctuations.',push:'Planck, Bohr and most physicists resisted light quanta for years. Millikan set out to refute Einstein’s equation and instead confirmed it (1914–16).'},
 {y:'1909',t:'exp',who:'Geoffrey Ingram Taylor',h:'Interference with feeble light',p:'Taylor photographed diffraction fringes with light so faint that the longest exposure took about three months. The fringes were unchanged: the pattern does not need many photons present at once.',push:'Later analysis (photon statistics): light from a dim thermal lamp is not a stream of single photons, so this did not strictly prove single-photon interference. That was settled by Grangier, Roger and Aspect in 1986.',try:'taylor',tl:'Single photons'},
 {y:'1924',t:'arg',who:'Louis de Broglie',h:'Matter has a wavelength: λ = h/p',p:'In his thesis, de Broglie proposed that every particle has a wave. Einstein supported the idea. In 1927 Davisson–Germer and G. P. Thomson observed electron diffraction.',push:'The examiners were unsure; Paul Langevin sent the thesis to Einstein for an opinion before it was accepted.',try:'tonomura',tl:'Electrons'},
 {y:'1926',t:'int',who:'Max Born',h:'|ψ|² is a probability',p:'Born proposed that the wavefunction gives the probability of finding the particle (the Born rule). Each dot on the screen lands at random; only the distribution is predicted.',quote:'I, at any rate, am convinced that He does not throw dice.',cite:'Einstein to Born, letter of 4 December 1926 (English translation)',push:'Schrödinger wanted ψ to be a real physical wave and disliked the probability reading and “quantum jumps”. Einstein rejected fundamental randomness for the rest of his life.',try:'born',tl:'Watch dots build up'},
 {y:'1927',t:'arg',who:'Einstein vs. Bohr (Solvay Conference)',h:'Can we know the slit and keep the fringes?',p:'Einstein proposed a movable (recoiling) slit plate: measure its recoil to learn which slit the particle used, and still see the fringes. Bohr replied that measuring the recoil precisely enough requires knowing the plate’s momentum so well that, by the uncertainty principle, its position is blurred by about one fringe spacing. That washes the pattern out.',cite:'Bohr, “Discussion with Einstein on Epistemological Problems in Atomic Physics” (1949)',push:'Bohr’s reply was accepted at the time. Later physicists (see 1991) argued that losing the fringes does not need a momentum kick at all; any record of the path is enough.',try:'einstein',tl:'Add which-path info'},
 {y:'1927',t:'arg',who:'Werner Heisenberg',h:'Watching the electron disturbs it',p:'With his gamma-ray microscope argument, Heisenberg explained the uncertainty principle as disturbance by measurement: light that reveals the slit kicks the electron.'},
 {y:'1927',t:'int',who:'Niels Bohr',h:'Complementarity',p:'In his Como lecture, Bohr argued that wave and particle descriptions are complementary. Both are needed, but a given experimental arrangement shows only one. The double slit with and without path detection is the standard example.'},
 {y:'1930',t:'arg',who:'Paul Dirac',h:'Each photon interferes only with itself',quote:'Each photon then interferes only with itself. Interference between two different photons never occurs.',cite:'The Principles of Quantum Mechanics (1930)',p:'Dirac’s point: the pattern is built one quantum at a time; it is not photons interfering with each other.',push:'Roy Glauber and later two-photon experiments (Hong–Ou–Mandel, 1987) showed the slogan is too narrow. What interferes are probability amplitudes for indistinguishable ways a detection event can happen, which can involve two photons.',try:'dirac',tl:'One photon at a time'},
 {y:'1932',t:'int',who:'John von Neumann · Eugene Wigner',h:'Measurement and “collapse”',p:'Von Neumann formalised measurement as a collapse of the wavefunction. Wigner (1961) suggested consciousness might cause it.',push:'Decoherence theory (H. Dieter Zeh 1970, Wojciech Zurek 1980s) showed that any physical record of the path destroys interference. No conscious observer is needed: a marker, a scattered photon or a detector does it.',try:'einstein',tl:'Record the path'},
 {y:'1952',t:'int',who:'David Bohm (after de Broglie 1927)',h:'Pilot wave: the particle goes through one slit',p:'In Bohm’s theory, each particle has a definite path, guided by the wave that goes through both slits. It reproduces all the standard predictions.',quote:'That way seems too cheap to me.',cite:'Einstein on Bohm’s theory, letter to Born, 12 May 1952',push:'Heisenberg called it a superfluous “ideological superstructure” (<i>Physics and Philosophy</i>, 1958). Pauli objected too. Later supporters (Bell among them) defended it as a clear counterexample to “no hidden variables” claims.',try:'bohm',tl:'Show Bohm trajectories'},
 {y:'1957',t:'int',who:'Hugh Everett III',h:'No collapse at all',p:'In the relative-state (“many-worlds”) view, the wavefunction never collapses. The detector and observer become entangled with every outcome.',push:'When Wheeler brought Everett’s ideas to Copenhagen in 1959, Bohr’s circle received them coldly. The interpretation was largely ignored until the 1970s.'},
 {y:'1961',t:'exp',who:'Claus Jönsson (Tübingen)',h:'First electron double-slit (and multi-slit) experiment',p:'Jönsson cut micrometre slits in a copper foil and showed electron interference for 1 to 5 slits. Many textbooks at the time still called the electron version a thought experiment.',try:'tonomura',tl:'Electrons'},
 {y:'1963',t:'arg',who:'Richard Feynman',h:'“The only mystery”',quote:'A phenomenon which is impossible, absolutely impossible, to explain in any classical way, and which has in it the heart of quantum mechanics. In reality, it contains the only mystery.',cite:'The Feynman Lectures on Physics, Vol. III, ch. 1',p:'Feynman compares bullets (P₁₂ = P₁ + P₂), water waves (amplitudes add) and electrons (single lumps that still interfere). He presented the electron version as an idealised experiment. In 1964 he also said, “I think I can safely say that nobody understands quantum mechanics.” (The Character of Physical Law, 1965)',push:'Some physicists argue that single-particle interference is not the deepest mystery, since a classical wave already shows it. The truly non-classical part is the random, localised detection, and above all entanglement (Bell, 1964).',try:'feynman',tl:'Close one slit, compare'},
 {y:'1974',t:'exp',who:'Pier Giorgio Merli, Gian Franco Missiroli, Giulio Pozzi (Bologna)',h:'Electrons arrive one at a time',p:'Using an electron biprism, the Bologna group recorded the pattern building up from single electrons and filmed it (1974; paper in <i>American Journal of Physics</i>, 1976).',push:'Priority dispute: when <i>Physics World</i> readers voted the single-electron double slit “the most beautiful experiment” (2002), credit went mainly to Tonomura (1989). The Bologna group and historians pointed out their earlier work.',try:'born',tl:'Watch dots build up'},
 {y:'1978',t:'arg',who:'John Archibald Wheeler',h:'Delayed choice',p:'Wheeler proposed choosing whether to look at fringes or at paths after the particle has passed the slits. Quantum mechanics predicts the result depends on the choice, with no contradiction.',quote:'No elementary phenomenon is a phenomenon until it is a registered (observed) phenomenon.',cite:'Wheeler (1978, 1983)',push:'Often misread as the future changing the past. Every experiment (e.g. Jacques et al., 2007) agrees with ordinary quantum mechanics, with no signal sent backwards.',try:'eraser',tl:'Decide later'},
 {y:'1979',t:'arg',who:'William Wootters & Wojciech Zurek · Berthold-Georg Englert',h:'Complementarity made quantitative',p:'Partial path information gives partial fringes. Englert (1996) proved the duality relation <i>D</i>² + <i>V</i>² ≤ 1 between path distinguishability <i>D</i> and fringe visibility <i>V</i> (see also Greenberger & Yasin, 1988).',try:'englert',tl:'Half path info'},
 {y:'1982',t:'arg',who:'Marlan Scully & Kai Drühl',h:'The quantum eraser',p:'If path information is stored in a marker and later erased, by measuring the marker in a basis that does not reveal the path, the fringes reappear in the sorted data. Realised as a delayed-choice eraser by Kim, Yu, Kulik, Shih and Scully (2000).',push:'Misread as retrocausal. The total pattern never shows fringes; fringes and anti-fringes appear only after the hits are sorted using the marker results, which arrive by ordinary (slower than light) means.',try:'eraser',tl:'Erase the path'},
 {y:'1986',t:'exp',who:'Philippe Grangier, Gérard Roger, Alain Aspect',h:'Proven single photons interfere',p:'With a source that emits exactly one photon at a time (shown by anticorrelation at a beam splitter), they observed single-photon interference, answering the criticism of Taylor-type experiments.',try:'dirac',tl:'Single photons'},
 {y:'1988',t:'exp',who:'Anton Zeilinger, Roland Gähler, Clifford Shull et al.',h:'Neutron double slit',p:'Precision double-slit diffraction of cold neutrons agreed with Schrödinger-equation predictions to high accuracy (<i>Reviews of Modern Physics</i>, 1988).',try:'neutron',tl:'Neutrons'},
 {y:'1989',t:'exp',who:'Akira Tonomura et al. (Hitachi)',h:'The famous single-electron build-up',p:'With a field-emission electron microscope and biprism, about 1000 electrons per second: each electron is in flight alone. Random dots slowly form fringes.',try:'tonomura',tl:'Tonomura settings'},
 {y:'1991',t:'crit',who:'Scully, Englert, Walther vs. Storey, Tan, Collett, Walls',h:'Does a momentum kick destroy the fringes?',p:'Scully, Englert and Walther (<i>Nature</i>, 1991) proposed which-way detection in micromaser cavities that barely disturbs the atom’s momentum. They argued the fringes vanish because of entanglement with path information, not Heisenberg-style kicks.',push:'Storey, Tan, Collett and Walls (<i>Nature</i>, 1994) argued that a sufficient momentum transfer is always present. The exchange continued in <i>Nature</i> (1995). Dürr, Nonn and Rempe’s atom-interferometer experiment (1998) supported the entanglement explanation.',try:'einstein',tl:'Marker, no kick'},
 {y:'1992',t:'crit',who:'Englert, Scully, Süssmann, Walther',h:'“Surrealistic” Bohm trajectories',p:'They showed that in which-way setups, Bohm trajectories can pass through one slit while the detector fires for the other, and called them “surrealistic”.',push:'Dürr, Fusseder, Goldstein and Zanghì replied that the detector reading need not reveal the Bohmian path; there is no contradiction within Bohm’s theory.',try:'bohm',tl:'Show trajectories'},
 {y:'1999',t:'exp',who:'Markus Arndt, Anton Zeilinger et al. (Vienna)',h:'C₆₀ molecules interfere',p:'Fullerene molecules of 60 carbon atoms, hot enough to emit thermal photons, still showed interference. Later experiments used molecules of more than 25 000 atomic mass units (2019).',push:'Open question: is there a size limit? Collapse models (GRW, Penrose) predict one; so far, no deviation from quantum mechanics has been found.',try:'c60',tl:'C₆₀ settings'},
 {y:'2002',t:'exp',who:'Physics World poll (Robert Crease)',h:'“The most beautiful experiment”',p:'Readers voted the double-slit experiment with single electrons the most beautiful experiment in physics.'},
 {y:'2004',t:'crit',who:'Shahriar Afshar',h:'Did complementarity break?',p:'Afshar claimed to detect high visibility and which-path information at once, using wires placed at the dark fringes.',push:'Bill Unruh, Ruth Kastner, Ole Steuernagel and others argued that the wires measure visibility, while the path “information” is only inferred, not measured on the same particles. Most physicists see no violation.'},
 {y:'2011',t:'exp',who:'Sacha Kocsis, Aephraim Steinberg et al.',h:'Average photon paths by weak measurement',p:'Weak measurements of photon momentum at many positions gave average trajectories through a double slit. They resemble Bohmian trajectories (<i>Science</i>, 2011).',push:'Critics stress that these are ensemble averages of weak values, not observed paths of individual photons, so they do not prove any interpretation.',try:'bohm',tl:'Trajectories'},
 {y:'2013',t:'exp',who:'Roger Bach, Herman Batelaan et al.',h:'Feynman’s thought experiment, done exactly',p:'With a movable mask, they opened slit 1, slit 2 or both, and recorded single electrons one by one. This realised Feynman’s idealised experiment in full (<i>New Journal of Physics</i>, 2013).',try:'feynman',tl:'Close one slit'}
];
let debFilter='all';
function buildDebates(){
  const v=$('vDeb');
  v.innerHTML=`<h2>Who said what about the double slit</h2>
   <p class="lede">More than two centuries of arguments. Cards marked <b>Try it</b> set up the lab to test the claim.</p>
   <div class="box"><h5>Read this first</h5><p>The animation shows <b>one particle’s wavefunction</b>. It is not a particle splitting in two. The wave is non-zero at both slits because the particle’s state is a superposition of “through the upper slit” and “through the lower slit”. Those amplitudes add. Only when the detector clicks does a single, localised dot appear.</p></div>
   <div class="filters" id="filt"></div><div class="tl-list" id="tlist"></div>
   <div class="box"><h5>Common misconceptions</h5><ul>
    <li><b>“Looking at it changes it.”</b> No mind is involved. Any physical record of the path (a marker state, a scattered photon) removes the interference term.</li>
    <li><b>“The particle splits in two.”</b> Detectors at both slits never fire together for one particle.</li>
    <li><b>“The eraser changes the past.”</b> The unsorted pattern never changes; fringes appear only in subsets sorted afterwards.</li>
    <li><b>“Fringes come from particles interfering with each other.”</b> The pattern builds up even with one particle in the apparatus at a time.</li></ul></div>
   <p class="lede">Sources: original papers and books named on each card; Bohr (1949); Feynman Lectures Vol. III; <i>Physics World</i> (Sept 2002); Rosa, <i>Physics in Perspective</i> 14 (2012) on the Bologna experiment; Nature 351, 111 (1991) and 367, 626 (1994).</p>`;
  const f=$('filt');
  [['all','All',null],['exp','Experiments','exp'],['arg','Arguments','arg'],['crit','Criticism','crit'],['int','Interpretations','int']].forEach(([k,n,c])=>{
    const b=document.createElement('button'); b.setAttribute('aria-pressed',k===debFilter); b.innerHTML=(c?`<i style="background:${TAGC[c]}"></i>`:'')+n;
    b.onclick=()=>{ debFilter=k; f.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderDeb(); }; f.appendChild(b); });
  renderDeb();
}
function renderDeb(){
  $('tlist').innerHTML=DEB.filter(d=>debFilter==='all'||d.t===debFilter||(debFilter==='crit'&&d.push)).map((d,i)=>`
   <article class="card" style="--c:${TAGC[d.t]}"><div><span class="yr">${d.y}</span><span class="tag">${TAGN[d.t]}</span></div>
   <h3>${d.h} <span>· ${d.who}</span></h3>${d.quote?`<blockquote>“${d.quote}”${d.cite?`<cite>${d.cite}</cite>`:''}</blockquote>`:''}
   ${d.p?`<p>${d.p}</p>`:''}${!d.quote&&d.cite?`<p class="hint">${d.cite}</p>`:''}
   ${d.push?`<div class="push"><b>Pushback</b>${d.push}</div>`:''}
   ${d.try?`<button class="try" data-s="${d.try}">Try it: ${d.tl}</button>`:''}</article>`).join('');
  $('tlist').querySelectorAll('.try').forEach(b=>b.onclick=()=>scenario(b.dataset.s));
}

/* scenarios */
function scenario(k){
  const base={theta:0,phi:0,tU:1,tL:1,openU:true,openL:true,bohm:false,bw:0,lc:200,inc:0,alpha:0};
  let set={}, msg='', mode=null, view=null;
  switch(k){
    case 'young': set={ptype:'photon',lam:550e-9,dReal:2.5e-4,LReal:1}; mode='cont'; msg='Light: the computed |E|² builds up as photon clicks.'; break;
    case 'taylor': case 'dirac': set={ptype:'photon',lam:550e-9,accel:1,collapse:true}; mode='single'; msg='One photon wavepacket. Its interference is with itself, then it clicks once.'; break;
    case 'tonomura': set={ptype:'electron',Ek:50e3*EV,dReal:1e-6,LReal:1.5,rate:1000}; mode='cont'; msg='50 keV electrons, about 1000 per second: one in the apparatus at a time.'; break;
    case 'born': set={}; mode='cont'; msg='Each dot is random. The Born rule predicts only the distribution.'; break;
    case 'neutron': set={ptype:'neutron',Ek:0.0025*EV,dReal:1.26e-4,LReal:5}; mode='cont'; break;
    case 'c60': set={ptype:'c60',Ek:0.5*720.66*AMU*220*220,dReal:1e-7,LReal:1.25}; mode='cont'; msg='C₆₀ at about 220 m/s: λ ≈ 2.5 pm, smaller than the molecule itself.'; break;
    case 'einstein': set={theta:90}; mode='cont'; msg='Full which-path marker (θ = 90°): the fringes disappear. Lower θ to bring them back.'; break;
    case 'englert': set={theta:45}; mode='cont'; msg='θ = 45°: partial path information, partial fringes. Check D² + V² in Live values.'; break;
    case 'eraser': set={theta:90}; mode='cont'; view='plus'; msg='Path marked. Now sort hits by the marker measured in the ± basis: fringes (+) and anti-fringes (−).'; break;
    case 'feynman': set={openL:false}; mode='cont'; msg='Lower slit closed (P₁). Pin the curve, open the slit, and compare P₁₂ with P₁ + P₂.'; break;
    case 'bohm': set={ptype: P.ptype==='photon'?'electron':P.ptype, bohm:true}; mode='single'; msg='Bohm trajectories: each path goes through one slit and never crosses the symmetry line.'; break;
  }
  Object.assign(P, base, set);
  if (set.ptype && set.ptype!=='photon' && set.Ek==null && P.ptype!=='custom') P.Ek=PT[P.ptype].Ek;
  if (mode) setMode(mode);
  if (view) setHitSel(view); else setHitSel('all');
  syncAll(); makeEngine(); binsReset(); startRun(); build3D(); updEq(); setTab('tDeb');
  if (!S.playing) setPlay(true);
  if (msg) toast(msg);
}

/* =====================================================================
   TRANSPORT
   ===================================================================== */
function setPlay(on){ S.playing=on; $('bPlay').textContent=on?'❚❚':'▶'; $('bPlay').setAttribute('aria-label',on?'Pause':'Play'); }
function setMode(m){ S.mode=m; $('modeSeg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m)); }
function setHitSel(v){ S.hitSel=v; $('hSel').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v)); rebuildHits3D(); }
function updTimeline(){ const t=$('tline'); t.max=Math.max(0,S.snaps.length-1); t.value=S.snaps.length-1; }
function setTab(w){ [['tDeb','vDeb'],['tRead','vRead'],['tEq','vEq']].forEach(([t,v])=>{ $(t).setAttribute('aria-selected',t===w); $(v).hidden=t!==w; }); }
function segBind(id, fn){ $(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{ $(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); fn(b.dataset.v||b.dataset.m); }); }

function bindTransport(){
  $('bPlay').onclick=()=>setPlay(!S.playing);
  $('bEmit').onclick=()=>{ startRun(); setPlay(true); };
  $('bReset').onclick=()=>{ binsReset(); startRun(); rebuildHits3D(); };
  $('bFwd').onclick=()=>{ setPlay(false); for (let k=0;k<S.snapEvery;k++) stepSim(); };
  $('bBack').onclick=()=>{ setPlay(false); const n=S.snaps.length; if (n>=2) restore(n-2); else if (n===1) restore(0); };
  $('bLoop').onclick=()=>{ S.loop=!S.loop; $('bLoop').setAttribute('aria-pressed',S.loop); };
  $('bSlow').onclick=()=>{ S.slow=!S.slow; $('bSlow').setAttribute('aria-pressed',S.slow); };
  $('spd').oninput=e=>{ S.spf=+e.target.value; };
  $('tline').oninput=e=>{ setPlay(false); restore(+e.target.value); };
  segBind('modeSeg', m=>{ setMode(m); if (m==='cont' && S.run.done) startRun(); });
  segBind('hSeg', v=>{ P.hMode=v; }); segBind('cSeg', v=>{ P.cMode=v; }); segBind('v2Seg', v=>{ P.v2=v; });
  segBind('hSel', v=>setHitSel(v));
  $('pinSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if (b.dataset.v==='pin'){ const src = S.events.length>50 ? Float64Array.from(S.acc) : Float64Array.from(S.runAcc);
      const name = `pin ${S.pins.length+1}: ${P.openU&&P.openL?'both':P.openU?'upper only':'lower only'}${P.theta?` θ=${P.theta}°`:''}`;
      S.pins.push({a:src,bins:P.bins,name}); if (S.pins.length>4) S.pins.shift(); toast('Curve pinned.'); }
    else { S.pins=[]; } });
  $('tDeb').onclick=()=>setTab('tDeb'); $('tRead').onclick=()=>setTab('tRead'); $('tEq').onclick=()=>setTab('tEq');
  window.addEventListener('keydown',e=>{ if (e.target.closest('input,select,textarea')) return; if (e.code==='Space'){ e.preventDefault(); setPlay(!S.playing); } });
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last=performance.now(), lastRO=0, acc=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if (S.playing && S.run){
    if (S.slow){ acc+=dt*12; } else acc+=dt*60*S.spf/ (S.spf>=1?1:1);
    let n=Math.floor(acc); acc-=n; if (S.slow) n=Math.min(n,1);
    const t0=performance.now();
    while (n-- > 0){ if (S.run.done){ if (S.mode==='cont' || S.loop) startRun(); else break; } stepSim(); if (performance.now()-t0>24){ acc=0; break; } }
  }
  if (S.run && S.run.flash>0) S.run.flash=Math.max(0,S.run.flash-dt*0.8);
  fillBuffer(); render3D(dt); render2D(); renderChart();
  $('tOut').textContent=`t = ${S.eng.t.toFixed(0)} · step ${S.run.steps}`;
  if (now-lastRO>250){ lastRO=now; readouts(); }
}

function boot(){
  buildControls(); buildDebates(); buildEqTab(); bindTransport();
  makeEngine(); binsReset(); startRun(); updEq();
  try { init3D(); } catch(err){ console.error(err); R3=null; const l=$('loading'); if (l) l.textContent='3D view unavailable on this device. The 2D view and screen still work.'; }
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) setPlay(false);
  requestAnimationFrame(loop);
}
boot();
</script>
